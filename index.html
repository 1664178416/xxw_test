<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生档案展示 Demov2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<div class="header">
    <span class="shield">◆</span>
    学生档案展示
</div>

<div class="notice">
    本页面为前端展示 Demo，不代表官方学历证明
</div>

<section class="profile-card">
    <div class="photos">
        <div class="photo">
            <div class="avatar">张</div>
            <small>个人照片</small>
        </div>
        <div class="photo">
            <div class="avatar gray">学</div>
            <small>学历照片</small>
        </div>
    </div>

    <div class="person">
        <div class="name">张三</div>
        <div class="gender">男　2003年05月18日</div>
    </div>

    <div class="school">电子科技大学</div>
    <div class="line">计算机科学与工程学院　|　普通全日制</div>

    <div class="badge">本科</div>
</section>


<section class="detail">

<div class="row"><label>民族</label><span>汉族</span></div>
<div class="row"><label>证件号码</label><span>****************</span></div>
<div class="row"><label>学制</label><span>4年</span></div>
<div class="row"><label>学历类别</label><span>普通高等教育</span></div>
<div class="row"><label>分院</label><span>计算机科学与工程学院</span></div>
<div class="row"><label>系所</label><span>-</span></div>
<div class="row"><label>班级</label><span>2021Demo01</span></div>
<div class="row"><label>学号</label><span>Demo20210001</span></div>
<div class="row"><label>入学日期</label><span>2021年08月26日</span></div>
<div class="row"><label>学籍状态</label><span>在籍（展示）</span></div>
<div class="row"><label>预计毕业日期</label><span>2027年06月30日</span></div>

</section>

<button>查看信息报告（Demo）</button>

</div>
</body>
</html>
