<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>学生档案展示 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="topbar-title">
      <span class="shield">◆</span>
      <span>高等学籍展示</span>
    </div>
    
  </header>

  <div class="demo-banner">
   
  </div>

  <section class="profile-card">
    <div class="photo-group">
      <a class="photo-item" href="assets/admission-photo.png" target="_blank" rel="noopener">
        <img class="avatar" src="assets/admission-photo.png" alt="录取照片占位图">
        <span class="photo-label">录取照片</span>
      </a>

      <a class="photo-item" href="assets/education-photo.svg" target="_blank" rel="noopener">
        <img class="avatar" src="assets/education-photo.svg" alt="">
        <span class="photo-label">学历照片</span>
      </a>
    </div>

    <div class="person">
      <div class="name">王永辉</div>
      <div class="gender">男　2004年05月18日</div>
    </div>

    <div class="school-block">
      <div class="school">电子科技大学</div>
      <div class="line">计算机科学与技术　|　普通全日制</div>
    </div>

    <div class="badge">本科</div>
  </section>

  <section class="detail">
    <div class="row"><label>民族</label><span>汉族</span></div>
    <div class="row"><label>证件号码</label><span>362227200209270919</span></div>
    <div class="row"><label>学制</label><span>4年</span></div>
    <div class="row"><label>学历类别</label><span>普通高等教育</span></div>
    <div class="row"><label>分院</label><span>计算机科学与工程学院</span></div>
    <div class="row"><label>系所</label><span>—</span></div>
    <div class="row"><label>班级</label><span>2023080501</span></div>
    <div class="row"><label>学号</label><span>2023080902012</span></div>
    <div class="row"><label>入学日期</label><span>2023年09月01日</span></div>
    <div class="row"><label>学籍状态</label><span>在籍</span></div>
    <div class="row"><label>预计毕业日期</label><span>2027年06月30日</span></div>
  </section>

  <button class="report-btn" type="button">查看信息报告</button>
  <footer class="footer-note">DEMO · NON-OFFICIAL PAGE</footer>
</main>
</body>
</html>
